[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graviteron"
version = "0.1.0"
description = "The Fundamental Unit of Verifiable Trust"
readme = "README.md"
authors = [
    {name = "Gravit Open Network Foundation", email = "info@gravit.space"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "redis>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx",
    "httpx2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 125
target-version = ["py39"]

[tool.ruff]
line-length = 125
select = ["E", "F", "I", "N"]
