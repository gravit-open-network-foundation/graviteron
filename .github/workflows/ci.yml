name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run lint checkers
      run: |
        pip install ruff black
        black --check src/
        ruff check src/

    - name: Run test suite
      run: |
        pytest -v

    - name: Evidence benchmark is reproducible (results must match byte for byte)
      run: |
        python benchmarks/evidence_benchmark.py > /dev/null
        python benchmarks/real_eurau/analyse.py > /dev/null
        python benchmarks/real_chfau/analyse.py > /dev/null
        git diff --exit-code benchmarks/

    - name: Unit test vectors are reproducible (byte for byte)
      run: |
        python vectors/generate.py > /dev/null
        git diff --exit-code vectors/
